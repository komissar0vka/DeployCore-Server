version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /apps/agent
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/apps/server", "/deploy"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
