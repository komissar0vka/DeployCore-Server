name: DeployCore Server images and release bundle

on:
  push:
    branches: [beta4-validation]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.repository == 'komissar0vka/DeployCore-Server' && (github.ref_type == 'tag' || github.ref_name == 'beta4-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify client release tag and run regression tests
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]
            grep -Fx "VERSION = \"$version\"" apps/server/deploycore/cloud_link.py
          else
            version="validation-${GITHUB_SHA:0:12}"
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          deploy/scripts/smoke.sh
      - name: Build and push immutable Server images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$VERSION"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --push -f apps/server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "ghcr.io/komissar0vka/deploycore-server-backend:$version" --metadata-file /tmp/server-image.json .
          docker buildx build --platform linux/amd64 --push -f deploy/Dockerfile.web \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "ghcr.io/komissar0vka/deploycore-server-web:$version" --metadata-file /tmp/web-image.json .
      - name: Package the installation bundle
        run: |
          set -euo pipefail
          version="$VERSION"
          bundle="$RUNNER_TEMP/deploycore-server"
          mkdir -p "$bundle" "$RUNNER_TEMP/release"
          git archive HEAD -- install.sh README.md CHANGELOG.md apps/agent apps/server apps/web \
            deploy/compose.yaml deploy/.env.example deploy/Dockerfile.web deploy/Dockerfile.web.dockerignore \
            deploy/nginx deploy/scripts packages/api-contract packages/licensing-contract \
            docs/releases/client-install.md | tar -xf - -C "$bundle"
          server=$(jq -er '."containerimage.digest"' /tmp/server-image.json)
          web=$(jq -er '."containerimage.digest"' /tmp/web-image.json)
          jq -n --arg server "ghcr.io/komissar0vka/deploycore-server-backend@$server" \
            --arg web "ghcr.io/komissar0vka/deploycore-server-web@$web" \
            '{$server, $web}' > "$bundle/deploy/release-images.json"
          python3 deploy/scripts/release_images.py "$bundle/deploy/release-images.json" > /dev/null
          tar -C "$bundle" -czf "$RUNNER_TEMP/release/deploycore-server-$version.tar.gz" .
          cd "$RUNNER_TEMP/release"
          sha256sum "deploycore-server-$version.tar.gz" > SHA256SUMS
      - name: Verify image-only installation and host backup
        run: |
          set -euo pipefail
          target="$(mktemp -d /tmp/deploycore-installed-XXXXXXXX)"
          tar -xzf "$RUNNER_TEMP/release/deploycore-server-$VERSION.tar.gz" -C "$target"
          export DOCKER_CONFIG="$HOME/.docker"
          export DEPLOYCORE_HTTPS_BIND=127.0.0.1
          printf '127.0.0.1\n18448\n\n' |
            sudo --preserve-env=DOCKER_CONFIG,DEPLOYCORE_HTTPS_BIND bash "$target/install.sh"
          sudo python3 deploy/scripts/ci-installed-server.py "$target" https://127.0.0.1:18448 "$RUNNER_TEMP/ux-login.json"
      - name: Capture hosted Chromium screenshots
        run: |
          set -euo pipefail
          npm --prefix "$RUNNER_TEMP/ux" install --no-package-lock --no-save playwright@1.58.2
          export NODE_PATH="$RUNNER_TEMP/ux/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/ux/node_modules/.bin/playwright" install --with-deps chromium
          mkdir "$RUNNER_TEMP/screenshots"
          sudo --preserve-env=NODE_PATH,PLAYWRIGHT_BROWSERS_PATH node deploy/scripts/ci-screenshots.cjs \
            "$RUNNER_TEMP/ux-login.json" "$RUNNER_TEMP/screenshots"
      - name: Verify beta.3 image-based upgrade and forced rollback
        run: |
          set -euo pipefail
          target="$(mktemp -d /tmp/deploycore-beta3-XXXXXXXX)"
          curl -fsSL https://github.com/komissar0vka/DeployCore-Releases/releases/download/v1.0.0-beta.3/deploycore-server-1.0.0-beta.3.tar.gz |
            tar -xzf - -C "$target"
          export DOCKER_CONFIG="$HOME/.docker"
          export COMPOSE_PROJECT_NAME=deploycore-hosted-upgrade
          export DEPLOYCORE_HTTPS_BIND=127.0.0.1
          printf '127.0.0.1\n18449\n\n' |
            sudo --preserve-env=DOCKER_CONFIG,COMPOSE_PROJECT_NAME,DEPLOYCORE_HTTPS_BIND bash "$target/install.sh"
          sudo --preserve-env=DOCKER_CONFIG,COMPOSE_PROJECT_NAME,DEPLOYCORE_HTTPS_BIND python3 deploy/scripts/ci-upgrade-server.py \
            "$target" "$RUNNER_TEMP/release/deploycore-server-$VERSION.tar.gz" https://127.0.0.1:18449
      - name: Remove validation registry credentials
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with:
          name: deploycore-server-images
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: deploycore-beta4-ux
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: error
