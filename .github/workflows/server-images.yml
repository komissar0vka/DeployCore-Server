name: DeployCore Server images and release bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.repository == 'komissar0vka/DeployCore-Server' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify client release tag and run regression tests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]
          grep -Fx "VERSION = \"$version\"" apps/server/deploycore/cloud_link.py
          deploy/scripts/smoke.sh
      - name: Build and push immutable Server images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --push -f apps/server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "ghcr.io/komissar0vka/deploycore-server-backend:$version" --metadata-file /tmp/server-image.json .
          docker buildx build --platform linux/amd64 --push -f deploy/Dockerfile.web \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "ghcr.io/komissar0vka/deploycore-server-web:$version" --metadata-file /tmp/web-image.json .
          docker logout ghcr.io
      - name: Package the installation bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="$RUNNER_TEMP/deploycore-server"
          mkdir -p "$bundle" "$RUNNER_TEMP/release"
          git archive HEAD -- install.sh README.md CHANGELOG.md apps/agent apps/server apps/web \
            deploy/compose.yaml deploy/.env.example deploy/Dockerfile.web deploy/Dockerfile.web.dockerignore \
            deploy/nginx deploy/scripts packages/api-contract packages/licensing-contract \
            docs/releases/client-install.md | tar -xf - -C "$bundle"
          server=$(jq -er '."containerimage.digest"' /tmp/server-image.json)
          web=$(jq -er '."containerimage.digest"' /tmp/web-image.json)
          jq -n --arg server "ghcr.io/komissar0vka/deploycore-server-backend@$server" \
            --arg web "ghcr.io/komissar0vka/deploycore-server-web@$web" \
            '{$server, $web}' > "$bundle/deploy/release-images.json"
          python3 deploy/scripts/release_images.py "$bundle/deploy/release-images.json" > /dev/null
          tar -C "$bundle" -czf "$RUNNER_TEMP/release/deploycore-server-$version.tar.gz" .
          cd "$RUNNER_TEMP/release"
          sha256sum "deploycore-server-$version.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: deploycore-server-images
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
