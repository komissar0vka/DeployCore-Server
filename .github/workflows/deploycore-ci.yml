name: DeployCore CI

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/deploycore-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/deploycore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'apps/server/requirements*.txt'
      - name: Test FastAPI
        working-directory: apps/server
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q
      - name: Build and test PostgreSQL, FastAPI, React and Nginx over HTTPS
        run: deploy/scripts/smoke.sh
  simulated-agents:
    if: github.ref_name == 'beta5-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        agents: [100, 500, 1000]
    steps:
      - uses: actions/checkout@v5
      - name: Measure authenticated agents against isolated Compose
        env:
          DEPLOYCORE_LOAD_COUNT: ${{ matrix.agents }}
          DEPLOYCORE_LOAD_REPORT: ${{ runner.temp }}/agent-load.json
        run: deploy/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-load-${{ matrix.agents }}
          path: ${{ runner.temp }}/agent-load.json
          if-no-files-found: ignore
  release-security:
    if: github.ref_name == 'beta5-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/agent/go.mod
          check-latest: true
      - name: Audit Python packages
        id: python
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement apps/server/requirements.txt
          if test -f apps/cloud/backend/requirements.txt; then
            python -m pip_audit --requirement apps/cloud/backend/requirements.txt
          fi
      - name: Audit npm lockfile
        id: npm
        continue-on-error: true
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Audit Windows agent
        id: go
        continue-on-error: true
        working-directory: apps/agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOOS=windows GOARCH=amd64 govulncheck ./...
      - name: Scan Git history for secrets
        id: secrets
        continue-on-error: true
        run: |
          bin="$RUNNER_TEMP/gitleaks"
          mkdir "$bin"
          cd "$bin"
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v$version"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$base/$archive"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$base/gitleaks_${version}_checksums.txt"
          awk -v name="$archive" '$2==name' "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact=100 "$GITHUB_WORKSPACE"
      - name: Build final Server container images on the runner
        run: |
          docker build -f apps/server/Dockerfile -t deploycore-security-server:ci .
          docker build -f deploy/Dockerfile.web -t deploycore-security-web:ci .
      - name: Scan backend image
        id: backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deploycore-security-server:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan web image
        id: web
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deploycore-security-web:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deploycore-security-server:ci
          format: cyclonedx
          output: backend.cdx.json
      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deploycore-security-web:ci
          format: cyclonedx
          output: web.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: server-image-sbom
          path: '*.cdx.json'
      - name: Require every security check to pass
        env:
          OUTCOMES: ${{ steps.python.outcome }} ${{ steps.npm.outcome }} ${{ steps.go.outcome }} ${{ steps.secrets.outcome }} ${{ steps.backend.outcome }} ${{ steps.web.outcome }}
        run: test "$OUTCOMES" = "success success success success success success"
  beta4-upgrade:
    if: github.ref_name == 'beta5-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Boot the exact public beta.4 release
        run: |
          archive="$RUNNER_TEMP/beta4.tar.gz"
          base=https://github.com/komissar0vka/DeployCore-Releases/releases/download/v1.0.0-beta.4
          curl -fsSL --retry 3 "$base/deploycore-server-1.0.0-beta.4.tar.gz" -o "$archive"
          printf '%s  %s\n' 5f1cfb93c4777a05450e06da8caf7f738307984bdaf39d8775c581fc40f7fa3c "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/beta4"
          tar -xzf "$archive" -C "$RUNNER_TEMP/beta4"
          export DEPLOYCORE_HTTPS_BIND=127.0.0.1
          printf '127.0.0.1\n18449\n\n' |
            sudo --preserve-env=DEPLOYCORE_HTTPS_BIND bash "$RUNNER_TEMP/beta4/install.sh"
      - name: Build the beta.5 candidate on the runner
        run: |
          set -euo pipefail
          docker build -f apps/server/Dockerfile -t deploycore-upgrade-backend:ci .
          docker build -f deploy/Dockerfile.web -t deploycore-upgrade-web:ci .
          root="$RUNNER_TEMP/candidate"
          mkdir -p "$root" "$RUNNER_TEMP/beta5"
          git archive HEAD -- install.sh apps/server/Dockerfile deploy/Dockerfile.web deploy/compose.yaml | tar -x -C "$root"
          server=$(docker image inspect --format '{{.Id}}' deploycore-upgrade-backend:ci)
          web=$(docker image inspect --format '{{.Id}}' deploycore-upgrade-web:ci)
          jq -n --arg server "$server" --arg web "$web" '{$server,$web}' >"$root/deploy/release-image-ids.json"
          jq -n --arg server "ghcr.io/komissar0vka/deploycore-server-backend@$server" \
             --arg web "ghcr.io/komissar0vka/deploycore-server-web@$web" '{$server,$web}' >"$root/deploy/release-images.json"
          docker save "$server" "$web" | gzip -1 >"$root/deploy/release-images.tar.gz"
          tar -czf "$RUNNER_TEMP/beta5/candidate.tar.gz" -C "$root" .
          (cd "$RUNNER_TEMP/beta5" && sha256sum candidate.tar.gz > SHA256SUMS)
      - name: Verify data retention and rollback on failed candidate startup
        run: |
          sudo python3 deploy/scripts/ci-upgrade-server.py "$RUNNER_TEMP/beta4" \
            "$RUNNER_TEMP/beta5/candidate.tar.gz" https://127.0.0.1:18449 1.0.0-beta.4 1.0.0-beta.5
