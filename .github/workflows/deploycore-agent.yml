name: DeployCore Windows Agent
on:
  push:
    paths: ['apps/agent/**', '.github/workflows/deploycore-agent.yml']
    tags: ['v*']
  pull_request:
    paths: ['apps/agent/**', '.github/workflows/deploycore-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: sudo apt-get update && sudo apt-get install -y wixl
      - run: ./build.sh dist
      - name: Retrieve the existing 0.3.8 Windows binaries from public beta.4
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/published-beta4.tar.gz"
          base=https://github.com/komissar0vka/DeployCore-Releases/releases/download/v1.0.0-beta.4
          curl -fsSL --retry 3 "$base/deploycore-server-1.0.0-beta.4.tar.gz" -o "$archive"
          printf '%s  %s\n' 5f1cfb93c4777a05450e06da8caf7f738307984bdaf39d8775c581fc40f7fa3c "$archive" | sha256sum -c -
          images="$(tar -xOf "$archive" ./deploy/release-image-ids.json)"
          tar -xOf "$archive" ./deploy/release-images.tar.gz > "$RUNNER_TEMP/beta4-images.tar.gz"
          docker load --input "$RUNNER_TEMP/beta4-images.tar.gz"
          image="$(jq -er .server <<<"$images")"
          container="$(docker create "$image")"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/deploycore/agent/deploycore-agent.exe" "$RUNNER_TEMP/deploycore-agent-0.3.8.exe"
          docker cp "$container:/opt/deploycore/agent/configured-agent.wxs" "$RUNNER_TEMP/configured-agent-0.3.8.wxs"
          docker cp "$container:/opt/deploycore/agent/VERSION" "$RUNNER_TEMP/published-agent-version"
          test "$(cat "$RUNNER_TEMP/published-agent-version")" = 0.3.8
      - name: Build configured MSI fixtures for service migration
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          cp "$RUNNER_TEMP/deploycore-agent-0.3.8.exe" "$fixture/deploycore-agent.exe"
          cp "$RUNNER_TEMP/configured-agent-0.3.8.wxs" "$fixture/configured-agent.wxs"
          cp "$RUNNER_TEMP/deploycore-agent-0.3.8.exe" dist/deploycore-agent-0.3.8.exe
          dist="$(realpath dist)"
          cd "$fixture"
          printf '%s' '{"server":"https://127.0.0.1:17777","token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' > enrollment.json
          wixl -a x64 -D Version=0.3.8 -o "$dist/migration-previous.msi" configured-agent.wxs
          cp "$dist/deploycore-agent.exe" ./deploycore-agent.exe
          cp "$dist/../configured-agent.wxs" ./configured-agent.wxs
          wixl -a x64 -D "Version=$(cat "$dist/../VERSION")" -o "$dist/migration-current.msi" configured-agent.wxs
      - uses: actions/upload-artifact@v4
        with:
          name: deploycore-agent-windows-amd64
          path: apps/agent/dist/
          if-no-files-found: error
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    needs: agent
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - run: go test ./...
        working-directory: apps/agent
      - name: Validate Windows PowerShell wizard syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'apps/agent/setup.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join "`n") }
      - uses: actions/download-artifact@v4
        with:
          name: deploycore-agent-windows-amd64
          path: agent-artifact
      - name: Exercise Windows file operations with publisher WinScan2PDF binaries
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'portable-fixtures'
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($file in @('WinScan2PDF','WinScan2PDF_Portable')) {
            $zip = Join-Path $root ($file + '.zip')
            Invoke-WebRequest "https://www.softwareok.com/Download/$file.zip" -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          }
          $env:DEPLOYCORE_TEST_PORTABLE_EXE = Join-Path $root 'WinScan2PDF.exe'
          $env:DEPLOYCORE_TEST_PORTABLE_UPDATE = Join-Path $root 'WinScan2PDF_p.exe'
          Push-Location apps/agent
          try {
            go test -run '^TestWinScanPortableLifecycle$' -count=1 -timeout 2m
            if ($LASTEXITCODE -ne 0) { throw 'Portable lifecycle failed' }
          } finally { Pop-Location }
      - name: Sign the disposable MSI with an isolated runner certificate
        shell: pwsh
        timeout-minutes: 3
        working-directory: agent-artifact
        run: |
          $signed = Join-Path (Get-Location) 'migration-signed.msi'
          Copy-Item -LiteralPath 'migration-current.msi' -Destination $signed
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=DeployCore Hosted Test' -CertStoreLocation Cert:\CurrentUser\My
          foreach ($storeName in @('Root','TrustedPublisher')) {
            $store = [Security.Cryptography.X509Certificates.X509Store]::new($storeName,'LocalMachine')
            $store.Open('ReadWrite')
            try { $store.Add($certificate) } finally { $store.Close() }
          }
          $signature = Set-AuthenticodeSignature -LiteralPath $signed -Certificate $certificate -HashAlgorithm SHA256
          if ($signature.Status -ne 'Valid') { throw "Hosted MSI signing failed: $($signature.Status)" }
          "DEPLOYCORE_TEST_MIGRATION_SIGNED=$signed" >> $env:GITHUB_ENV
          $pin = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificate.RawData))
          "DEPLOYCORE_TEST_PUBLISHER_SHA256=$pin" >> $env:GITHUB_ENV
      - name: Exercise MSI lifecycle on Windows
        shell: pwsh
        working-directory: agent-artifact
        run: |
          $msi = Join-Path (Get-Location) 'deploycore-agent.msi'
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "MSI install failed: $($result.ExitCode)" }
          $agent = Join-Path $env:ProgramFiles 'DeployCore Agent/deploycore-agent.exe'
          if ((& $agent version) -ne (Get-Content ../apps/agent/VERSION)) { throw 'Incorrect packaged agent version' }
          & $agent check --server https://127.0.0.1:1
          if ($LASTEXITCODE -eq 0) { throw 'An unavailable endpoint passed the readiness check' }
          $env:DEPLOYCORE_TEST_PACKAGED_AGENT = $agent
          $env:DEPLOYCORE_TEST_LEGACY_AGENT = Join-Path (Get-Location) 'deploycore-agent-0.3.8.exe'
          $env:DEPLOYCORE_TEST_MIGRATION_PREVIOUS = Join-Path (Get-Location) 'migration-previous.msi'
          $env:DEPLOYCORE_TEST_MIGRATION_CURRENT = Join-Path (Get-Location) 'migration-current.msi'
          $env:DEPLOYCORE_TEST_MIGRATION_SCRIPT = Join-Path (Get-Location) 'upgrade-agent.ps1'
          Push-Location ../apps/agent
          try {
            go test -run '^TestPackagedAgentService$' -count=1 -timeout 4m
            if ($LASTEXITCODE -ne 0) { throw 'Windows service integration failed' }
          } finally {
            Pop-Location
          }
          $result = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path $agent)) { throw 'MSI uninstall failed' }
