server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/deploycore/tls/fullchain.pem;
    ssl_certificate_key /etc/deploycore/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/api/v1/packages/(intakes|[^/]+/versions/[^/]+/artifact)$ {
        client_max_body_size 2048m;
        proxy_request_buffering off;
        proxy_send_timeout 120s;
        proxy_read_timeout 140s;
        include /etc/nginx/deploycore-api.conf;
    }

    location = /api/v1/licenses/cloud {
        client_max_body_size 128k;
        proxy_read_timeout 35s;
        include /etc/nginx/deploycore-api.conf;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_read_timeout 10s;
        include /etc/nginx/deploycore-api.conf;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
