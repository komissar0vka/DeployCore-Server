name: deploycore

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:-deploycore}
  POSTGRES_DB: ${POSTGRES_DB:-deploycore}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}

services:
  db:
    image: postgres:16-alpine
    environment: *database-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      <<: *database-env
      POSTGRES_HOST: db
      DEPLOYCORE_SETUP_TOKEN: ${DEPLOYCORE_SETUP_TOKEN:-}
      DEPLOYCORE_PACKAGE_MAX_MIB: ${DEPLOYCORE_PACKAGE_MAX_MIB:-1024}
      DEPLOYCORE_ENABLE_EXECUTION: ${DEPLOYCORE_ENABLE_EXECUTION:-0}
      DEPLOYCORE_PACKAGE_RESERVE_MIB: ${DEPLOYCORE_PACKAGE_RESERVE_MIB:-256}
      DEPLOYCORE_LICENSE_TRUST: ${DEPLOYCORE_LICENSE_TRUST:-}
      DEPLOYCORE_PACKAGE_CA_FILE: ${DEPLOYCORE_PACKAGE_CA_FILE:-}
    volumes:
      - package-data:/var/lib/deploycore/packages
      - cloud-link:/var/lib/deploycore/cloud
    networks: [edge, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${DEPLOYCORE_HTTPS_BIND:-127.0.0.1}:${DEPLOYCORE_HTTPS_PORT:-8443}:443"
    volumes:
      - type: bind
        source: ${DEPLOYCORE_TLS_DIR:-./tls}
        target: /etc/deploycore/tls
        read_only: true
        bind:
          create_host_path: false
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ && wget --no-check-certificate -q -O /dev/null https://127.0.0.1/api/health/live"]
      interval: 5s
      timeout: 6s
      retries: 10
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  package-data:
  cloud-link:
